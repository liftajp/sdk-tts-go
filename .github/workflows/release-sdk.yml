name: SDK リリース

on:
  workflow_dispatch:
    inputs:
      version:
        description: "公開する SDK_VERSION。空欄の場合は SDK_VERSION ファイルを使用します。"
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: sdk-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: ソースを取得
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Go を設定
        uses: actions/setup-go@v5
        with:
          go-version-file: sdk/go.mod

      - name: リリース情報を確認
        id: release
        shell: bash
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail

          version="${REQUESTED_VERSION:-}"
          if [[ -z "$version" ]]; then
            version="$(tr -d '[:space:]' < SDK_VERSION)"
          fi

          if [[ ! "$version" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::SDK_VERSION が不正です: $version"
            exit 1
          fi

          branch="release/$version"
          tag="sdk/$version"

          if git ls-remote --exit-code --heads origin "$branch" >/dev/null 2>&1; then
            echo "::error::リリースブランチは既に存在します: $branch"
            exit 1
          fi

          if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null 2>&1; then
            echo "::error::タグは既に存在します: $tag"
            exit 1
          fi

          {
            echo "version=$version"
            echo "branch=$branch"
            echo "tag=$tag"
          } >> "$GITHUB_OUTPUT"

      - name: リリースブランチを作成
        env:
          RELEASE_BRANCH: ${{ steps.release.outputs.branch }}
        run: |
          set -euo pipefail
          git switch -c "$RELEASE_BRANCH"

      - name: 公開用ファイルを整理
        run: ./scripts/prepare-sdk-release.sh sdk

      - name: 整理後の SDK を検証
        run: ./scripts/check-sdk.sh sdk

      - name: 整理内容をコミット
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sdk
          git commit -m "chore: prepare SDK release ${{ steps.release.outputs.version }}"

      - name: リリースブランチを push
        env:
          RELEASE_BRANCH: ${{ steps.release.outputs.branch }}
        run: git push origin "$RELEASE_BRANCH"

      - name: タグを作成して push
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail
          git tag -a "$RELEASE_TAG" -m "Release TikTok Shop Go SDK $RELEASE_VERSION"
          git push origin "$RELEASE_TAG"
