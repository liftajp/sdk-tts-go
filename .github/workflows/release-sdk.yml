name: Release SDK

on:
  push:
    branches:
      - main
    paths:
      - api/**
      - apis/**
      - models/**
      - utils/**
      - changelog.txt
      - go.mod
      - go.sum
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-sdk
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Test generated SDK
        run: go test ./...

      - name: Resolve release version
        id: release
        shell: bash
        run: |
          set -euo pipefail

          version="$(tr -d '[:space:]' < SDK_VERSION)"
          if [[ ! "$version" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "SDK_VERSION must be a semantic version beginning with v: $version" >&2
            exit 1
          fi

          if git show-ref --tags --verify --quiet "refs/tags/$version"; then
            echo "Tag already exists: $version" >&2
            exit 1
          fi

          release_branch="release/$version"
          if git ls-remote --exit-code --heads origin "$release_branch" >/dev/null 2>&1; then
            echo "Release branch already exists: $release_branch" >&2
            exit 1
          fi

          {
            echo "version=$version"
            echo "branch=$release_branch"
          } >> "$GITHUB_OUTPUT"

      - name: Create release branch and tag
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
          RELEASE_BRANCH: ${{ steps.release.outputs.branch }}
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git switch -c "$RELEASE_BRANCH"
          git push origin "$RELEASE_BRANCH"

          git tag -a "$RELEASE_VERSION" -m "Release TikTok Shop Go SDK $RELEASE_VERSION"
          git push origin "$RELEASE_VERSION"
