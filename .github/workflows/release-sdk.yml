name: Release SDK

on:
  push:
    branches:
      - main
    paths:
      - golang/**
      - SDK_VERSION
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-sdk
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: golang/go.mod

      - name: Test generated SDK
        run: go test ./...
        working-directory: golang

      - name: Check SDK version change
        id: version_changed
        shell: bash
        run: |
          set -euo pipefail

          current="$(tr -d '[:space:]' < SDK_VERSION)"
          previous="$(git show "${GITHUB_SHA}^:SDK_VERSION" 2>/dev/null | tr -d '[:space:]' || true)"
          if [[ "$current" == "$previous" ]]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "SDK_VERSION is unchanged; skip release creation."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "SDK_VERSION changed from '$previous' to '$current'."
          fi

      - name: Resolve release version
        id: release
        if: steps.version_changed.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail

          version="$(tr -d '[:space:]' < SDK_VERSION)"
          if [[ ! "$version" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "SDK_VERSION must be a semantic version beginning with v: $version" >&2
            exit 1
          fi

          tag="golang/$version"
          if git show-ref --tags --verify --quiet "refs/tags/$tag"; then
            echo "Tag already exists: $tag" >&2
            exit 1
          fi

          release_branch="release/$version"
          if git ls-remote --exit-code --heads origin "$release_branch" >/dev/null 2>&1; then
            echo "Release branch already exists: $release_branch" >&2
            exit 1
          fi

          {
            echo "version=$version"
            echo "branch=$release_branch"
            echo "tag=$tag"
          } >> "$GITHUB_OUTPUT"

      - name: Create release branch and tag
        if: steps.version_changed.outputs.changed == 'true'
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
          RELEASE_BRANCH: ${{ steps.release.outputs.branch }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git switch -c "$RELEASE_BRANCH"
          git push origin "$RELEASE_BRANCH"

          git tag -a "$RELEASE_TAG" -m "Release TikTok Shop Go SDK $RELEASE_VERSION"
          git push origin "$RELEASE_TAG"
