name: SDK チェック

on:
  push:
    branches:
      - main
    paths:
      - sdk/**
      - SDK_VERSION
      - Makefile
      - scripts/**
      - .github/workflows/check-sdk.yml
      - .github/workflows/release-sdk.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: ソースを取得
        uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - name: Go を設定
        uses: actions/setup-go@v7
        with:
          go-version-file: sdk/go.mod
          cache-dependency-path: sdk/go.sum

      - name: SDK パッケージを検証
        run: make check-sdk

      - name: Trivy セキュリティスキャン
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: secret,misconfig
          severity: HIGH,CRITICAL
          exit-code: '1'

      - name: SDK バージョンを確認
        run: make validate-version
