name: SDK チェック

on:
  push:
    branches:
      - main
    paths:
      - sdk/**
      - SDK_VERSION
      - .github/workflows/check-sdk.yml
      - .github/workflows/release-sdk.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: ソースを取得
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Go を設定
        uses: actions/setup-go@v5
        with:
          go-version-file: sdk/go.mod
          cache-dependency-path: sdk/go.sum

      - name: SDK パッケージを検証
        run: ./scripts/check-sdk.sh sdk

      - name: SDK バージョンを確認
        shell: bash
        run: |
          set -euo pipefail

          current="$(tr -d '[:space:]' < SDK_VERSION)"
          previous="$(git show 'HEAD^:SDK_VERSION' 2>/dev/null | tr -d '[:space:]' || true)"

          if [[ ! "$current" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::SDK_VERSION is not a valid semantic version: $current"
            exit 1
          fi

          if [[ -z "$previous" ]]; then
            echo "SDK_VERSION=$current (initial version)"
          elif [[ "$current" == "$previous" ]]; then
            echo "::warning::SDK_VERSION did not change ($current). The SDK check passed, but a release will not be created until the version is updated."
          else
            echo "SDK_VERSION changed: $previous -> $current"
          fi
